[package]
name = "betterlgtm"
version = "0.3.0"
description = "Review GitHub pull requests with Claude Code, from your desktop"
authors = ["Mohamed Shaban"]
license = "MIT"
repository = "https://github.com/drmas/betterlgtm"
edition = "2024"

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name (needed on Windows).
name = "betterlgtm_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "io-util", "macros", "sync"] }
tauri-plugin-process = "2"
tauri-plugin-notification = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
